
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Product Inventory Dashboard</h1>
        <p class="subtitle">Manage products and view inventory analytics</p>

        <section class="card">
            <h2>Add New Product</h2>

            <form id="productForm">
                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                    required
                >

                <input
                    type="number"
                    id="productPrice"
                    placeholder="Enter product price"
                    min="0.01"
                    step="0.01"
                    required
                >

                <button type="submit">Add Product</button>
            </form>

            <p id="message"></p>
        </section>

        <section class="card">
            <h2>Inventory Roster</h2>

            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Category</th>
                    </tr>
                </thead>
                <tbody id="productList"></tbody>
            </table>
        </section>

        <section class="card">
            <h2>Financial Analytics</h2>

            <p>Total Inventory Value: <strong id="totalValue">$0</strong></p>

            <h3>Affordable Products (Under $200)</h3>
            <p id="affordableProducts"></p>

            <h3>Formatted Report</h3>
            <ul id="reportList"></ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
